server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: pixel-chat-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pixelchat}
    username: ${DB_USER:pixelchat}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
pixelchat:
  dev-mode: ${PIXEL_CHAT_DEV_MODE:false}
  email:
    from: ${MAIL_FROM:no-reply@pixelchat.local}
